[package]
name = "minrx"
version = "0.1.0"
edition = "2021"
authors = ["Michael J. Haertel", "Rust conversion by Claude"]
license = "BSD-2-Clause"
description = "A minimal matcher for POSIX Extended Regular Expressions"

[dependencies]
libc = "0.2"
bitflags = "2.4"

[lib]
name = "minrx"
crate-type = ["lib", "cdylib", "staticlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
