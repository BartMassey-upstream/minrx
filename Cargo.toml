[package]
name = "minrx"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael J. Haertel", "Rust conversion by Claude"]
license = "BSD-2-Clause"
description = "A minimal matcher for POSIX Extended Regular Expressions"
repository = "https://github.com/BartMassey-upstream/minrx"
homepage = "https://github.com/BartMassey-upstream/minrx"
documentation = "https://docs.rs/minrx"
readme = "README.md"
keywords = ["regex", "posix", "ere", "pattern", "matching"]
categories = ["text-processing", "parsing"]
exclude = [
    "*.cpp",
    "*.c",
    "Makefile",
    "meson.build",
    "subprojects/",
    ".vscode/",
    "blog-post.md",
    "transcript.md",
]

[dependencies]
libc = "0.2"
bitflags = "2.4"

[dev-dependencies]
version-sync = "0.9"

[lib]
name = "minrx"
crate-type = ["lib", "cdylib", "staticlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[badges.maintenance]
status = "actively-developed"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
